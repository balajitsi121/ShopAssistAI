# Render Blueprint: deploys the ShopAssist FastAPI service.
services:
  - type: web
    name: shopassist-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: SHOPASSIST_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
