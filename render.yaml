# Render Blueprint: deploys the ShopAssist FastAPI service.
# LLM: any OpenAI-compatible API with tool calling. Defaults below use OpenRouter's free router;
# for DeepSeek set LLM_BASE_URL=https://api.deepseek.com and LLM_MODEL=deepseek-v4-flash.
services:
  - type: web
    name: shopassist-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openrouter/free
      - key: SHOPASSIST_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
